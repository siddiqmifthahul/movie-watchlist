{% extends "base.html" %}
{% block title %}{{ 'Edit movie' if editing else 'Add movie' }}{% endblock %}
{% block content %}
<form method="post" class="form" action="{{ url_for('edit_movie', movie_id=movie_id) if editing else url_for('add_movie') }}">
  <h1>{{ 'Edit movie' if editing else 'Add movie' }}</h1>

  <label>Title
    <input name="title" required maxlength="200" value="{{ movie.title or '' }}" autofocus>
  </label>

  <div class="row">
    <label>Genre
      <select name="genre" required>
        <option value="" disabled {{ 'selected' if not movie.genre }}>Choose…</option>
        {% for g in genres %}<option {{ 'selected' if movie.genre == g }}>{{ g }}</option>{% endfor %}
      </select>
    </label>
    <label>Year
      <input name="year" inputmode="numeric" maxlength="4" placeholder="2010" value="{{ movie.year or '' }}">
    </label>
  </div>

  <div class="row">
    <label>Status
      <select name="status">
        {% for key, label in statuses.items() %}<option value="{{ key }}" {{ 'selected' if movie.status == key }}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label>Rating (1–10)
      <input name="rating" inputmode="numeric" maxlength="2" value="{{ movie.rating or '' }}">
    </label>
  </div>

  <label>Notes
    <textarea name="notes" rows="4" placeholder="Who recommended it, where to stream it…">{{ movie.notes or '' }}</textarea>
  </label>

  <div class="row end">
    <a href="{{ url_for('index') }}">Cancel</a>
    <button class="btn">{{ 'Save changes' if editing else 'Add movie' }}</button>
  </div>
</form>
{% endblock %}
